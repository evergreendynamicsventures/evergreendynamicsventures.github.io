<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evergreen Dynamics Ventures</title>
  
  <!-- Google Site Verification - Required for Play Console -->
  <meta name="google-site-verification" content="H72wYPZfQgHzysuS-JM72H5fz1nDt3RjbrxEtZ1qSCw" />

  <!-- Styling -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    header {
      text-align: center;
      padding: 60px 20px;
      color: white;
    }
    
    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      font-weight: 700;
    }
    
    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    
    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }
    
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    
    .contact-item {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }
    
    .contact-item h3 {
      color: #667eea;
      font-size: 0.9rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .contact-item p, .contact-item a {
      color: #333;
      font-size: 1.05rem;
      text-decoration: none;
    }
    
    .contact-item a:hover {
      color: #667eea;
    }
    
    footer {
      text-align: center;
      padding: 30px 20px;
      color: white;
      opacity: 0.8;
      font-size: 0.9rem;
    }
    
    @media (max-width: 600px) {
      header h1 { font-size: 2rem; }
      .card { padding: 25px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Evergreen Dynamics Ventures</h1>
    <p>Building solutions that last</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>About Us</h2>
      <p>Evergreen Dynamics Ventures is committed to delivering innovative technology solutions with integrity and excellence.</p>
      <p>We focus on creating products that solve real problems and stand the test of time.</p>
    </div>
